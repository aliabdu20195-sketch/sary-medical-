<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8E1B3F">
<title>مستشفى الدكتور حاشد الطبر التخصصي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#8E1B3F;--wine-d:#6B1230;--paper:#F4EFEA;--card:#fff;--line:#E6DED6;--ink:#2B1E22;--soft:#7A6B6F;--ok:#1F8A5E;--warn:#B8862B;--bad:#B23A2E;--wa:#1FA855;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:#E9E2DB;font-family:'Tajawal',system-ui,sans-serif;color:var(--ink);line-height:1.6}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:3px solid #E0A93B;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.app{max-width:720px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:62px;position:relative;overflow-x:hidden}
.hidden{display:none!important}

/* hero */
.hero{position:relative;height:300px;background:#3a2a30;overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.slide.on{opacity:1}
.slide img{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,10,15,.55) 0%,rgba(20,10,15,0) 38%,rgba(244,239,234,0) 62%,var(--paper) 100%);pointer-events:none}
.hero-top{position:absolute;top:0;right:0;left:0;z-index:3;display:flex;align-items:center;gap:12px;padding:14px 16px}
.logo{width:56px;height:56px;border-radius:12px;background:#fff;object-fit:contain;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.hero-top b{display:block;color:#fff;font-size:19px;font-weight:800;line-height:1.3;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.hero-top span{display:block;color:#F6D9E0;font-size:12.5px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.slide-text{position:absolute;z-index:3;right:18px;left:70px;bottom:44px}
.slide-text h2{margin:0;font-size:22px;font-weight:800;color:var(--ink)}
.slide-text p{margin:0;font-size:14px;color:#4b3a40}
.arrow{position:absolute;z-index:4;top:46%;width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center;color:var(--ink)}
.arrow.r{right:10px}.arrow.l{left:10px}

/* stats */
.stats{position:relative;z-index:5;margin:-34px 14px 0;background:var(--card);border-radius:var(--r);box-shadow:0 6px 22px rgba(60,20,30,.12);display:flex}
.stat{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 6px;border-inline-end:1px solid var(--line)}
.stat:last-child{border:0}
.stat .ic{font-size:30px;color:var(--wine)}
.stat b{display:block;font-size:20px;line-height:1.1;color:var(--ink)}
.stat span{font-size:11.5px;color:var(--soft);font-weight:600}

/* search */
.search{display:flex;margin:14px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.search .ic{align-self:center;margin-inline:12px;color:var(--soft);font-size:18px}
.search input{flex:1;min-width:0;border:0;outline:0;padding:11px 0;background:none;font-size:14px}
.search button{background:var(--wine);color:#fff;font-weight:700;padding:0 22px;order:-1}
.search{flex-direction:row}

/* menu */
.menu{margin:0 14px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:right;border-bottom:1px solid var(--line)}
.mi:last-child{border:0}
.mi:active{background:#faf4f1}
.mi .ic.big{font-size:26px;color:var(--wine)}
.mi .n{font-weight:800;color:var(--wine);font-size:14px;width:22px}
.mi div{flex:1}
.mi b{display:block;font-size:14.5px;line-height:1.3}
.mi small{color:var(--soft);font-size:12px}
.mi .chev{color:var(--soft);font-size:16px}

/* sections */
.sec{margin:14px 14px 0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.sec-h small{display:block;color:var(--soft);font-size:12px}
.sec-h h3{margin:0;font-size:19px;font-weight:800}
.link{color:var(--wine);font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:2px}
.row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x proximity;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.cc{flex:0 0 84px;scroll-snap-align:start;text-align:center;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(60,20,30,.06)}
.cc-img{height:68px;display:grid;place-items:center;font-size:34px;overflow:hidden}
.cc-img img{width:100%;height:100%;object-fit:cover}
.cc b{display:block;font-size:11.5px;padding:5px 3px 7px;line-height:1.35;min-height:44px}
.nc{flex:0 0 150px;scroll-snap-align:start;text-align:right;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.nc-img{height:72px;background:#eadfd8;display:grid;place-items:center;font-size:28px}
.nc-img img{width:100%;height:100%;object-fit:cover}
.nc div.b{padding:6px 8px 8px}
.tag{font-size:11px;font-weight:800}
.tag.news{color:#1E6FA8}.tag.activity{color:#C2571B}
.nc b{display:block;font-size:12.5px;line-height:1.4}
.nc small{color:var(--soft);font-size:11px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 14px 0}
.box{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:12.5px}
.box h4{margin:0 0 6px;font-size:14.5px;display:flex;align-items:center;gap:6px;color:var(--wine)}
.box p{margin:0 0 8px;color:#5a4a50}
.box .ln{display:flex;gap:6px;align-items:flex-start;color:#5a4a50;margin-bottom:4px}
.box .ln .ic{color:var(--wine);margin-top:4px}
.outline{display:block;width:100%;border:1.5px solid var(--wine);color:var(--wine);border-radius:8px;padding:7px;font-weight:700;font-size:12.5px;text-align:center}
.wa{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);color:#fff;border-radius:8px;padding:9px;font-weight:700;font-size:13px;margin-top:8px;width:100%}

.foot{margin:14px 14px 0;background:#fff;border:1px solid var(--line);border-radius:var(--r);display:flex;flex-wrap:wrap}
.foot button{flex:1 1 33%;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 4px;font-size:11.5px;font-weight:700;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line)}
.foot .ic{color:var(--wine);font-size:17px}

/* الشريط العاجل: ثابت أسفل الصفحة دائماً */
.ticker{position:fixed;bottom:0;right:0;left:0;z-index:90;height:42px;background:var(--wine);color:#fff;display:flex;align-items:stretch;overflow:hidden;max-width:720px;margin:0 auto;box-shadow:0 -3px 12px rgba(60,20,30,.25)}
.t-label{background:#C8102E;display:flex;align-items:center;gap:6px;padding:0 14px;font-weight:800;font-size:13px;z-index:2}
.t-label .ic{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.t-view{flex:1;overflow:hidden;direction:rtl}
.t-track{display:flex;width:max-content;height:100%;align-items:center;animation:tk 40s linear infinite;direction:rtl}
.t-track span{padding:0 26px;font-size:13px;font-weight:600;white-space:nowrap;border-inline-end:1px solid rgba(255,255,255,.3)}
.ticker:hover .t-track{animation-play-state:paused}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(50%)}}

/* sheet */
.sheet{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column;max-width:720px;margin:0 auto}
.sheet.open{display:flex}
.sheet-h{display:flex;align-items:center;gap:10px;background:var(--wine);color:#fff;padding:12px 14px}
.sheet-h h3{margin:0;flex:1;font-size:17px}
.sheet-h button{color:#fff;font-size:22px;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15)}
.sheet-b{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h4{margin:0 0 10px;font-size:15.5px;color:var(--wine)}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:13px;font-weight:700}
.f input,.f select,.f textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fdfbf9;width:100%;font-size:14.5px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--wine);outline:0;background:#fff}
.f textarea{min-height:76px;resize:vertical}
.f.err input,.f.err select,.f.err textarea{border-color:var(--bad);background:#fbf0ef}
.f .e{color:var(--bad);font-size:12px;min-height:1em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--wine);color:#fff;border-radius:10px;padding:11px 18px;font-weight:700;font-size:14.5px}
.btn.block{width:100%}.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:#fff;color:var(--wine);border:1.5px solid var(--wine)}
.btn.green{background:var(--wa)}.btn.red{background:var(--bad)}.btn.gray{background:#ece5df;color:var(--ink)}.btn.blue{background:#1E6FA8}
.btn:disabled{opacity:.55}
.computed{background:#f8ece0;border:1px dashed #C17A3A;border-radius:10px;padding:9px;text-align:center;font-weight:700;font-size:14px}
.note{background:#fbf3e0;border:1px solid #ead29a;color:#6f5414;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.note.ok{background:#e9f5ee;border-color:#bfe0cd;color:#1b5b40}
.note.imp{background:#fdeceb;border-color:#f0b9b4;color:#7d2219}
.confirm{text-align:center}
.confirm h3{color:var(--ok);margin:0 0 6px}
.ref{display:inline-block;margin:10px 0;border:1.5px dashed var(--wine);border-radius:8px;padding:6px 16px;font-weight:800;letter-spacing:1px;direction:ltr}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:800}
.b-pending,.b-open{background:#fcefda;color:var(--warn)}.b-confirmed,.b-answered{background:#e1f3e8;color:var(--ok)}
.b-done,.b-closed{background:#e4eaf3;color:#0A2744}.b-cancelled{background:#fbe7e5;color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.tabs button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.tabs button.on{background:var(--wine);color:#fff;border-color:var(--wine)}
.item{display:flex;gap:10px;align-items:flex-start}
.item img,.item .ph{width:62px;height:62px;border-radius:10px;object-fit:cover;background:#eadfd8;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.item h5{margin:0;font-size:14.5px}
.item p{margin:2px 0 0;font-size:12.5px;color:var(--soft)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--soft);font-weight:700}.kv dd{margin:0}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;padding:4px 0}
.msg{max-width:84%;padding:8px 12px;border-radius:14px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.msg small{display:block;font-size:10.5px;opacity:.7;margin-top:2px}
.msg.mine{align-self:flex-start;background:var(--wine);color:#fff;border-end-start-radius:4px}
.msg.theirs{align-self:flex-end;background:#fff;border:1px solid var(--line);border-end-end-radius:4px}
.chat-in{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:-14px;background:var(--paper);padding:10px 0 4px}
.chat-in textarea{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px;max-height:120px}
.empty{text-align:center;color:var(--soft);padding:26px 10px;font-size:13.5px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat-row div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat-row b{display:block;font-size:20px;color:var(--wine)}.stat-row span{font-size:11px;color:var(--soft)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters input,.filters select{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;background:#fff;width:100%}
.filters .full{grid-column:1/-1}
.chk{display:flex;flex-wrap:wrap;gap:8px}.chk label{font-weight:500;display:flex;gap:4px;align-items:center;font-size:13px}
.chk input{width:auto}
.cmp{margin-top:6px;background:#fff7e8;border-right:3px solid #E0A93B;border-radius:6px;padding:6px 10px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.cmp b{color:var(--warn);font-size:12px}
.src{font-size:11px;color:var(--soft)}

/* admin */
.admin{position:fixed;inset:0;z-index:150;background:var(--paper);display:none;flex-direction:column;max-width:720px;margin:0 auto}
.admin.open{display:flex}
.admin-h{background:var(--wine-d);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px}
.admin-h b{flex:1;font-size:15.5px}
.admin-h button{background:rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:700}
.admin-t{padding:10px 14px 0;background:#fff;border-bottom:1px solid var(--line)}
.admin-t .tabs{margin:0;padding-bottom:10px}
.admin-b{flex:1;overflow-y:auto;padding:14px}
.toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#2B1E22;color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;z-index:400;display:none;max-width:90vw;text-align:center}
.toast.show{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hero" id="hero">
    <div id="slides"></div>
    <div class="hero-top">
      <img class="logo" id="logo" alt="الشعار">
      <div><b id="hName"></b><span id="hTag"></span></div>
    </div>
    <div class="slide-text" id="slideText"></div>
    <button class="arrow r" id="prev" aria-label="السابق" data-ic="chev-r"></button>
    <button class="arrow l" id="next" aria-label="التالي" data-ic="chev"></button>
  </header>

  <div class="stats">
    <div class="stat"><span data-ic="users"></span><div><b id="stClinics">0</b><span>عيادة متخصصة</span></div></div>
    <div class="stat"><span data-ic="user"></span><div><b id="stDocs">0</b><span>طبيب مختص</span></div></div>
    <div class="stat"><span data-ic="clock"></span><div><b>24/7</b><span>استقبال الحجوزات</span></div></div>
  </div>

  <form class="search" id="searchForm" role="search">
    <span data-ic="search"></span>
    <input id="searchIn" type="search" placeholder="ابحث عن تخصص طبي أو طبيب..." aria-label="بحث">
    <button type="submit">بحث</button>
  </form>

  <nav class="menu" aria-label="الخدمات">
    <button class="mi" data-act="book"><span class="big" data-ic="cal"></span><span class="n">01</span><div><b>حجز طبي جديد</b><small>احجز موعدك خلال دقيقة</small></div><span class="chev" data-ic="chev"></span></button>
    <button class="mi" data-act="track"><span class="big" data-ic="clip"></span><span class="n">02</span><div><b>متابعة حجوزاتي</b><small>تابع حالة مواعيدك الحالية</small></div><span class="chev" data-ic="chev"></span></button>
    <button class="mi" data-act="consult"><span class="big" data-ic="chat"></span><span class="n">03</span><div><b>استشارة طبية</b><small>تواصل مع الطبيب مباشرة عبر الشات</small></div><span class="chev" data-ic="chev"></span></button>
    <button class="mi" data-act="news"><span class="big" data-ic="news"></span><span class="n">04</span><div><b>الأخبار والفعاليات</b><small>آخر مستجدات المستشفى</small></div><span class="chev" data-ic="chev"></span></button>
    <button class="mi" data-act="about"><span class="big" data-ic="info"></span><span class="n">05</span><div><b>من نحن وتخصصاتنا</b><small>تعرف على كوادرنا الطبية</small></div><span class="chev" data-ic="chev"></span></button>
  </nav>

  <section class="sec" id="clinicsSec">
    <div class="sec-h"><div><small>التخصصات</small><h3>عياداتنا المتخصصة</h3></div><button class="link" data-act="clinics"><span data-ic="chev"></span>عرض جميع التخصصات</button></div>
    <div class="row" id="clinicsRow"></div>
  </section>

  <section class="sec" id="newsSec">
    <div class="sec-h"><div><small>مستجدات</small><h3>آخر الأخبار والفعاليات</h3></div><button class="link" data-act="news"><span data-ic="chev"></span>عرض الكل</button></div>
    <div class="row" id="newsRow"></div>
  </section>

  <div class="two">
    <div class="box" id="contactBox"></div>
    <div class="box" id="aboutBox"></div>
  </div>

  <div class="foot">
    <button data-act="login-admin"><span data-ic="gear"></span>دخول المدير</button>
    <button data-act="login-reception"><span data-ic="clip"></span>دخول الاستقبال</button>
    <button data-act="login-doctor"><span data-ic="user"></span>دخول الأطباء</button>
    <button data-act="install"><span data-ic="phone"></span>تثبيت التطبيق</button>
    <button data-act="share"><span data-ic="share"></span>مشاركة الرابط</button>
  </div>
</div>

<div class="ticker" id="ticker"><div class="t-label"><span data-ic="spk"></span>عاجل</div><div class="t-view"><div class="t-track" id="tTrack"></div></div></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><h3 id="sheetTitle"></h3><button id="sheetClose" aria-label="إغلاق" data-ic="x"></button></div><div class="sheet-b" id="sheetBody"></div></div>

<div class="admin" id="admin"><div class="admin-h"><b id="adminTitle">لوحة التحكم</b><button data-act="admin-back">← الموقع</button><button data-act="logout">خروج</button></div><div class="admin-t"><div class="tabs" id="adminTabs"></div></div><div class="admin-b" id="adminBody"></div></div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ============ أدوات ============ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function pad(n){return n<10?"0"+n:""+n}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseYmd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function latin(s){return String(s).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)})}
function normPhone(raw){var p=latin(raw).replace(/\D/g,"");if(p.indexOf("00967")===0)p=p.slice(5);else if(p.indexOf("967")===0&&p.length===12)p=p.slice(3);else if(p.charAt(0)==="0"&&p.length===10)p=p.slice(1);return p}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function newRef(prefix){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",o="",r=new Uint8Array(6);crypto.getRandomValues(r);for(var i=0;i<6;i++)o+=a.charAt(r[i]%a.length);return prefix+"-"+o}

function imgData(file,max,q){return new Promise(function(res,rej){
  if(!file||!/^image\//.test(file.type))return rej(new Error("type"));
  var fr=new FileReader();fr.onerror=function(){rej(new Error("read"))};
  fr.onload=function(){var im=new Image();im.onerror=function(){rej(new Error("img"))};
    im.onload=function(){var k=Math.min(1,(max||720)/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q||.72))};
    im.src=fr.result};
  fr.readAsDataURL(file)})}

function fromCode(o){
  if(!o||typeof o!=="object")return "كود غير صالح";
  var ref=String(o.r||""),ph=String(o.p||"");
  if(!/^HT-[A-Z2-9]{6}$/.test(ref))return "مرجع الحجز غير صالح";
  if(!/^7[0-9]{8}$/.test(ph))return "رقم الجوال في الكود غير صالح";
  var d=doctorById(String(o.d||""));if(!d)return "الطبيب غير موجود في هذا النظام";
  var cl=clinicById(d.clinicId);if(!cl)return "عيادة الطبيب غير موجودة";
  var sd=String(o.sd||""),st=String(o.st||"");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(sd)||!DB.settings.slots.some(function(t){return t.v===st}))return "الموعد غير صالح";
  var n=String(o.n||"").trim().slice(0,120);if(n.length<3)return "اسم المريض غير صالح";
  var a=Number(o.a);if(!isFinite(a)||a<0||a>120)return "العمر غير صالح";
  return{ref:ref,phone:ph,name:n,gender:o.g==="أنثى"?"أنثى":"ذكر",ageValue:Math.floor(a),ageUnit:o.u==="شهر"?"شهر":"سنة",address:String(o.ad||"").slice(0,200),clinicId:cl.id,clinicName:cl.name,doctorId:d.id,doctor:d.name,slotDate:sd,slotTime:st,slotLabel:slotLabel(sd,st),notes:String(o.nt||"").slice(0,1000),status:"pending",created:Number(o.c)||Date.now(),source:"import"}}

function openChat(ref,staff){
  var c=DB.consults.filter(function(x){return x.ref===ref})[0];if(!c)return;
  var wa=DB.settings.whatsapp&&!staff?'<a class="btn sm green" href="'+esc(waLink(DB.settings.whatsapp,"استشارة رقم "+c.ref+" — "+c.name))+'" target="_blank" rel="noopener">واتساب</a>':"";

      $("#chMsgs",root).innerHTML=cc.messages.map(function(m){var mine=staff?m.from==="s":m.from==="p";var tm=new Date(m.t);
        return '<div class="msg '+(mine?"mine":"theirs")+'">'+esc(m.text)+'<small>'+(m.from==="s"?esc(m.who||"الفريق الطبي")+" · ":"")+pad(tm.getHours())+":"+pad(tm.getMinutes())+" "+tm.getDate()+"/"+(tm.getMonth()+1)+'</small></div>'}).join("");

function statusMsg(x){
  if(x.status==="confirmed")return "مرحباً "+x.name+"، تم تأكيد موعدك في "+x.clinicName+" مع "+x.doctor+" بتاريخ "+x.slotLabel+". رقم المرجع: "+x.ref+". "+DB.settings.name;
  if(x.status==="cancelled")return "مرحباً "+x.name+"، تم إلغاء حجزك رقم "+x.ref+". يسعدنا خدمتك في أي وقت. "+DB.settings.name;
  if(x.status==="done")return "مرحباً "+x.name+"، نشكرك على زيارتك. نسأل الله لك الشفاء العاجل. "+DB.settings.name;
  return "مرحباً "+x.name+"، بخصوص طلب حجزك رقم "+x.ref+" في "+DB.settings.name+"."}
function findBk(ref){DB=load();return DB.bookings.filter(function(k){return k.ref===ref})[0]}

   var html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8"><!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet><x:Name>الحجوزات</x:Name><x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body dir="rtl"><table border="1"><tr>'+th+'</tr>'+tr+'</table></body></html>';

 "bk-csv":function(){var rows=filteredBk();if(!rows.length){toast("لا توجد بيانات");return}
   var head=["المرجع","المريض","الجنس","العمر","الجوال","العنوان","العيادة","الطبيب","الموعد","الحالة","الشكوى","التاريخ"];
   var lines=[head.map(csvCell).join(",")];rows.forEach(function(b){lines.push([b.ref,b.name,b.gender,b.ageValue+" "+b.ageUnit,b.phone,b.address,b.clinicName,b.doctor,b.slotLabel,ST[b.status],b.notes,new Date(b.created).toLocaleString("en-GB")].map(csvCell).join(","))});
   download("bookings-"+ymd(new Date())+".csv","\uFEFF"+lines.join("\r\n"),"text/csv;charset=utf-8")},
 "imp-go":function(){
   var txt=$("#impTx").value,re=/HTB1:([A-Za-z0-9+\/=]+)/g,m,added=0,errs=[],seen=0;DB=load();
   while((m=re.exec(txt))){seen++;var o;
     try{o=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){errs.push("كود تالف");continue}
     var r=fromCode(o);if(typeof r==="string"){errs.push(r);continue}
     if(session.role==="doctor"&&r.doctorId!==session.id){errs.push("الحجز "+r.ref+" ليس لك");continue}
     if(DB.bookings.some(function(b){return b.ref===r.ref})){errs.push(r.ref+" مستورد مسبقاً");continue}
     if(slotTaken(r.doctorId,r.slotDate,r.slotTime)){errs.push(r.ref+": الموعد محجوز لمريض آخر — تواصل مع المريض لتغييره");continue}
     DB.bookings.unshift(r);added++;push("booking",r)}
   if(!seen){toast("لم أجد كود حجز (HTB1:) في النص");return}
   if(added)save();
   $("#impTx").value="";
   toast((added?"تم استيراد "+added+" حجز":"لم يُستورد شيء")+(errs.length?" — "+errs.join("، "):""));
   if(added)renderAdmin("bk")},

 "dr-edit":function(b){editing.doctor=b.dataset.id;renderAdmin();$("#adminBody").scrollTop=0},"dr-cancel":function(){editing.doctor=null;renderAdmin()},

   var f=$("#drImg").files[0];if(f){try{d.photo=await imgData(f,420)}catch(e){toast("الملف ليس صورة صالحة");return}}

 "st-save":async function(){var S=DB.settings;
   var slots=[];$("#sSlotsTx").value.split("\n").forEach(function(l){l=l.trim();if(!l)return;var p=l.split("|");if(p.length>=2&&/^\d{1,2}:\d{2}$/.test(p[0].trim()))slots.push({v:p[0].trim().padStart(5,"0"),l:p.slice(1).join("|").trim()})});
   if(!slots.length){toast("أدخل وقت حجز واحد على الأقل بصيغة 09:00|09:00 ص");return}
   var pass=$("#sPass").value.trim();if(pass.length<6){toast("كلمة مرور المدير 6 أحرف على الأقل");return}
   var rpass=$("#sRecPass").value.trim();if(rpass.length<6){toast("كلمة مرور الاستقبال 6 أحرف على الأقل");return}
   if(rpass===pass){toast("اجعل كلمة مرور الاستقبال مختلفة عن المدير");return}
   var slides=$("#sSlides").value.split("\n").map(function(l){return l.trim()}).filter(Boolean).map(function(l,i){var p=l.split("|");return{title:p[0].trim(),desc:(p.slice(1).join("|")||"").trim(),img:(S.slides[i]&&S.slides[i].img)||""}});
   var wd=$$(".wd").filter(function(x){return x.checked}).map(function(x){return +x.value});
   S.name=$("#sName").value.trim()||S.name;S.tagline=$("#sTag").value.trim();S.about=$("#sAbout").value.trim();
   S.phones=$("#sPhones").value.split(/[,\s]+/).map(function(x){return x.replace(/\D/g,"")}).filter(Boolean);S.whatsapp=$("#sWa").value.replace(/\D/g,"");
   S.address=$("#sAddr").value.trim();S.map=$("#sMap").value.trim();S.workDays=wd.length?wd:[6,0,1,2,3,4];S.slots=slots;S.lead=Math.max(0,+$("#sLead").value||0);
   S.adminPass=pass;S.receptionPass=rpass;S.webhook=$("#sHook").value.trim();S.slides=slides.length?slides:S.slides;
   try{var lf=$("#sLogo").files[0];if(lf)S.logo=await imgData(lf,256,.85);var hf=$("#sHero").files[0];if(hf)S.hero=await imgData(hf,1100,.72)}catch(e){toast("ملف الصورة غير صالح");return}
   if(save()){toast("تم حفظ الإعدادات");renderAdmin()}},
 "bak-exp":function(){download("hospital-backup-"+ymd(new Date())+".json",JSON.stringify(DB),"application/json")},

   var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.settings||!o.clinics)throw 0;localStorage.setItem(KEY,JSON.stringify(o));DB=load();toast("تم الاستيراد");renderAdmin()}catch(e){toast("ملف غير صالح")}};r.readAsText(f)},

};
function download(name,content,type){var a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type:type}));a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1000)}

hydrateIcons(document);
renderHome();autoSlide();
})();
